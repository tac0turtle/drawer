excluded:
  - Dozer
  - build
  - DerivedData

opt_in_rules:
  - closure_body_length
  - empty_count
  - fatal_error_message
  - force_unwrapping
  - implicitly_unwrapped_optional
  - multiline_arguments
  - multiline_function_chains
  - vertical_whitespace_closing_braces

disabled_rules:
  - trailing_comma

force_unwrapping:
  severity: error

file_length:
  warning: 200
  error: 300

function_body_length:
  warning: 50
  error: 70

type_body_length:
  warning: 150
  error: 200

line_length:
  warning: 120
  error: 150
  ignores_comments: true
